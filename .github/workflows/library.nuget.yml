name: build

on:
  release:
    types: [created]
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore LiteObservableCollections.slnx

      - name: Build
        run: dotnet build src/LiteObservableCollections/LiteObservableCollections.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/LiteObservableCollections.Tests/LiteObservableCollections.Tests.csproj --configuration Release --no-restore

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            src/LiteObservableCollections/bin/Release/*.nupkg
            src/LiteObservableCollections/bin/Release/*.snupkg
